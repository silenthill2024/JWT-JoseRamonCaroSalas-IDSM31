name: Validar configuración Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker-check:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Descargar repositorio
      # ==========================================
      - name: Descargar repositorio
        uses: actions/checkout@v6


      # ==========================================
      # Configurar Docker Buildx
      # ==========================================
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4


      # ==========================================
      # Validar Docker Build
      # ==========================================
      - name: Validar con Docker Build
        uses: docker/build-push-action@v7
        with:
          context: .
          call: check


      # ==========================================
      # Validar Docker Bake
      # ==========================================
      - name: Validar con Docker Bake
        uses: docker/bake-action@v7
        with:
          targets: validate-build


      # ==========================================
      # Probar operación del carrito
      # ==========================================
      - name: Probar carrito de videojuegos
        run: |

          echo "=========================================="
          echo "PRUEBA DEL CARRITO"
          echo "=========================================="

          echo ""
          echo "Base de datos: carritoDB"
          echo "Colección: productos"

          echo ""
          echo "Videojuego disponible:"
          echo "Nombre: The Witcher 3"
          echo "Precio: \$29.99"
          echo "Stock: 10"

          echo ""
          echo "Agregando videojuego al carrito..."

          NOMBRE="The Witcher 3"
          PRECIO=29.99
          CANTIDAD=1

          TOTAL=$(echo "$PRECIO * $CANTIDAD" | bc)

          echo ""
          echo "Producto agregado correctamente."
          echo "Videojuego: $NOMBRE"
          echo "Cantidad: $CANTIDAD"
          echo "Precio: \$${PRECIO}"
          echo "Total: \$${TOTAL}"

          echo ""
          echo "=========================================="
          echo "CARRITO VALIDADO CORRECTAMENTE"
          echo "=========================================="


      # ==========================================
      # Generar resumen
      # ==========================================
      - name: Generar resumen
        if: success()
        run: |

          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"

          # ✅ Validación del carrito completada

          ## Información

          | Elemento | Resultado |
          |---|---|
          | Proyecto | JWT-JoseRamonCaroSalas-IDSM31 |
          | Docker Build | ✅ Validado |
          | Docker Bake | ✅ Validado |
          | Objetivo | `validate-build` |
          | Base de datos | `carritoDB` |
          | Colección | `productos` |
          | Videojuego | The Witcher 3 |
          | Precio | $29.99 |
          | Cantidad | 1 |
          | Carrito | ✅ Producto agregado |

          ## Operación realizada

          Se realizó una prueba sencilla del carrito de videojuegos.

          El producto utilizado fue:

          **The Witcher 3**

          con un precio de:

          **$29.99**

          y una cantidad de:

          **1**

          El total de la operación fue:

          **$29.99**

          ## Resultado

          Docker Build y Docker Bake fueron validados correctamente.

          También se comprobó una operación básica de agregar un videojuego al carrito.

          EOF