
name: Validar configuración Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker-check:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validar con Docker Build
        uses: docker/build-push-action@v7
        with:
          context: .
          call: check

      - name: Validar con Docker Bake
        uses: docker/bake-action@v7
        with:
          targets: validate-build

      - name: Generar resumen de Docker Bake
        if: success()
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          # ✅ Validación de Docker Bake completada

          ## Información de la ejecución

          | Elemento |          Resultado            |
          |----------|-------------------------------|
          | Proyecto | JWT-JoseRamonCaroSalas-IDSM31 |
          | Herramienta | Docker Bake                |
          | Objetivo | `validate-build`              |
          | Método   | `call = check`                |
          | Estado   | ✅ Ejecutado correctamente    |
          | Advertencias| ✅ Ninguna                 |

          ## Resultado

          Docker Bake ejecutó correctamente el objetivo `validate-build`.

          Las comprobaciones de compilación finalizaron correctamente y no se generaron advertencias durante la validación.

          La configuración del `Dockerfile` y de `docker-bake.hcl` fue procesada correctamente por Docker Buildx.
          EOF
