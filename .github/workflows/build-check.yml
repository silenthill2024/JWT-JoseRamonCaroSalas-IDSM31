name: Validar configuración Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker-check:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Descargar repositorio
      # ==========================================
      - name: Descargar repositorio
        uses: actions/checkout@v6


      # ==========================================
      # Configurar Docker Buildx
      # ==========================================
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4


      # ==========================================
      # Validar Docker Build
      # ==========================================
      - name: Validar con Docker Build
        uses: docker/build-push-action@v7
        with:
          context: .
          call: check


      # ==========================================
      # Validar Docker Bake
      # ==========================================
      - name: Validar con Docker Bake
        uses: docker/bake-action@v7
        with:
          targets: validate-build


      # ==========================================
      # Probar operación del carrito
      # ==========================================
      - name: Probar carrito de videojuegos
        run: |

          echo "=========================================="
          echo "PRUEBA DEL CARRITO"
          echo "=========================================="

          echo ""
          echo "Base de datos: carritoDB"
          echo "Colección: productos"

          echo ""
          echo "Videojuegos disponibles:"
          echo "1. The Witcher 3 - \$29.99"
          echo "2. Red Dead Redemption 2 - \$59.99"
          echo "3. Cyberpunk 2077 - \$49.99"
          echo "4. Elden Ring - \$59.99"

          # Precios
          WITCHER=29.99
          RED_DEAD=59.99
          CYBERPUNK=49.99
          ELDEN_RING=59.99

          # Cantidad de cada producto
          CANTIDAD=1

          # Calcular total
          TOTAL=$(echo "$WITCHER + $RED_DEAD + $CYBERPUNK + $ELDEN_RING" | bc)

          echo ""
          echo "=========================================="
          echo "AGREGANDO PRODUCTOS AL CARRITO"
          echo "=========================================="

          echo ""
          echo "Producto: The Witcher 3"
          echo "Cantidad: 1"
          echo "Precio: \$29.99"
          echo "Agregado correctamente."

          echo ""
          echo "Producto: Red Dead Redemption 2"
          echo "Cantidad: 1"
          echo "Precio: \$59.99"
          echo "Agregado correctamente."

          echo ""
          echo "Producto: Cyberpunk 2077"
          echo "Cantidad: 1"
          echo "Precio: \$49.99"
          echo "Agregado correctamente."

          echo ""
          echo "Producto: Elden Ring"
          echo "Cantidad: 1"
          echo "Precio: \$59.99"
          echo "Agregado correctamente."

          echo ""
          echo "=========================================="
          echo "RESUMEN DEL CARRITO"
          echo "=========================================="

          echo "The Witcher 3: \$29.99"
          echo "Red Dead Redemption 2: \$59.99"
          echo "Cyberpunk 2077: \$49.99"
          echo "Elden Ring: \$59.99"

          echo ""
          echo "Cantidad total de videojuegos: 4"
          echo "Total del carrito: \$${TOTAL}"

          echo ""
          echo "=========================================="
          echo "CARRITO VALIDADO CORRECTAMENTE"
          echo "=========================================="


      # ==========================================
      # Generar resumen
      # ==========================================
      - name: Generar resumen
        if: success()
        run: |

          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"

          # ✅ Validación del carrito completada

          ## Información

          | Elemento | Resultado |
          |---|---|
          | Proyecto | JWT-JoseRamonCaroSalas-IDSM31 |
          | Docker Build | ✅ Validado |
          | Docker Bake | ✅ Validado |
          | Objetivo | `validate-build` |
          | Base de datos | `carritoDB` |
          | Colección | `productos` |

          ## Videojuegos

          | Videojuego | Precio | Cantidad |
          |---|---:|---:|
          | The Witcher 3 | $29.99 | 1 |
          | Red Dead Redemption 2 | $59.99 | 1 |
          | Cyberpunk 2077 | $49.99 | 1 |
          | Elden Ring | $59.99 | 1 |

          ## Total del carrito

          **$199.96**

          ## Operación realizada

          Se realizó una prueba sencilla del carrito de videojuegos.

          Se agregaron cuatro videojuegos:

          - **The Witcher 3** — $29.99
          - **Red Dead Redemption 2** — $59.99
          - **Cyberpunk 2077** — $49.99
          - **Elden Ring** — $59.99

          La cantidad agregada fue de **1 unidad por videojuego**.

          El total de la operación fue:

          **$199.96**

          ## Resultado

          Docker Build y Docker Bake fueron validados correctamente.

          También se comprobó una operación básica de agregar cuatro videojuegos al carrito.

          EOF