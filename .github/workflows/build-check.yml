name: Validar configuración Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker-check:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------
      # Descargar repositorio
      # ---------------------------------------------
      - name: Descargar repositorio
        uses: actions/checkout@v6

      # ---------------------------------------------
      # Configurar Docker Buildx
      # ---------------------------------------------
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ---------------------------------------------
      # Validación con Docker Build
      # ---------------------------------------------
      - name: Validar con Docker Build
        uses: docker/build-push-action@v7
        with:
          context: .
          call: check

      # ---------------------------------------------
      # Validación con Docker Bake
      # ---------------------------------------------
      - name: Validar con Docker Bake
        uses: docker/bake-action@v7
        with:
          targets: validate-build

      # ---------------------------------------------
      # Construcción de la aplicación
      # ---------------------------------------------
      - name: Construir imagen del carrito
        run: |
          docker build -t carrito-app:validation .

      # ---------------------------------------------
      # Crear red Docker
      # ---------------------------------------------
      - name: Crear red Docker
        run: |
          docker network create carrito-net

      # ---------------------------------------------
      # Ejecutar MongoDB
      # ---------------------------------------------
      - name: Iniciar MongoDB
        run: |
          docker run -d \
            --name carrito-mongodb \
            --network carrito-net \
            mongo:7

      # ---------------------------------------------
      # Esperar MongoDB
      # ---------------------------------------------
      - name: Esperar MongoDB
        run: |
          echo "Esperando a que MongoDB inicie..."

          for i in {1..30}; do
            if docker exec carrito-mongodb \
              mongosh --quiet \
              --eval "db.adminCommand('ping').ok" | grep -q "1"; then

              echo "MongoDB está listo."
              break
            fi

            echo "MongoDB todavía no está listo..."
            sleep 2
          done

      # ---------------------------------------------
      # Insertar videojuegos en carritoDB
      # ---------------------------------------------
      - name: Cargar productos en carritoDB
        run: |
          docker exec -i carrito-mongodb mongosh carritoDB <<'EOF'

          db.productos.deleteMany({})

          db.productos.insertMany([
            {
              nombre: "The Witcher 3",
              precio: 39.99,
              stock: 10,
              imagen: "witcher3.jpg"
            },
            {
              nombre: "Cyberpunk 2077",
              precio: 49.99,
              stock: 8,
              imagen: "cyberpunk2077.jpg"
            },
            {
              nombre: "Red Dead Redemption 2",
              precio: 59.99,
              stock: 12,
              imagen: "rdr2.jpg"
            },
            {
              nombre: "Elden Ring",
              precio: 59.99,
              stock: 15,
              imagen: "eldenring.jpg"
            }
          ])

          print("Productos insertados:")
          printjson(db.productos.find().toArray())

          EOF

      # ---------------------------------------------
      # Ejecutar aplicación
      # ---------------------------------------------
      - name: Iniciar aplicación del carrito
        run: |
          docker run -d \
            --name carrito-app \
            --network carrito-net \
            -p 3000:3000 \
            -e MONGODB_URI="mongodb://carrito-mongodb:27017/carritoDB" \
            -e JWT_SECRET="clave_validacion_github_actions" \
            carrito-app:validation

          echo "Esperando a que la aplicación inicie..."
          sleep 10

      # ---------------------------------------------
      # Mostrar productos
      # ---------------------------------------------
      - name: Mostrar productos del carrito
        run: |
          echo "=========================================="
          echo "SALIDA DE LA APLICACIÓN DEL CARRITO"
          echo "=========================================="

          echo ""
          echo "Consulta GET /api/productos/productos:"
          echo ""

          curl -f -i http://localhost:3000/api/productos/productos

          echo ""
          echo "=========================================="
          echo "LOGS DE LA APLICACIÓN"
          echo "=========================================="

          docker logs carrito-app

      # ---------------------------------------------
      # Generar Summary
      # ---------------------------------------------
      - name: Generar resumen de Docker Bake y aplicación
        if: success()
        run: |
          PRODUCTOS=$(curl -s http://localhost:3000/api/productos/productos)

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"

          # ✅ Validación y ejecución del carrito completadas

          ## Información de la ejecución

          | Elemento | Resultado |
          |---|---|
          | Proyecto | JWT-JoseRamonCaroSalas-IDSM31 |
          | Base de datos | \`carritoDB\` |
          | Colección | \`productos\` |
          | Docker Build | ✅ Validado |
          | Docker Bake | ✅ Validado |
          | Objetivo | \`validate-build\` |
          | Método | \`call = check\` |
          | Imagen | \`carrito-app:validation\` |
          | MongoDB | ✅ Ejecutado |
          | Productos | ✅ Cargados |
          | Aplicación | ✅ Ejecutada |
          | API | ✅ Respondió correctamente |

          ## Resultado de Docker Bake

          La configuración de Docker Bake fue validada correctamente.

          ## Productos de carritoDB

          Se cargaron los videojuegos en la base de datos:

          - The Witcher 3
          - Cyberpunk 2077
          - Red Dead Redemption 2
          - Elden Ring

          ## Salida de la aplicación

          Se realizó una petición GET al endpoint:

          \`/api/productos/productos\`

          La aplicación respondió con:

          \`\`\`json
          $PRODUCTOS
          \`\`\`

          ## Resultado

          La aplicación del carrito fue ejecutada correctamente dentro
          del contenedor Docker y logró conectarse a MongoDB mediante:

          \`mongodb://carrito-mongodb:27017/carritoDB\`

          También se comprobó que la API puede consultar los videojuegos
          almacenados en la colección \`productos\`.

          EOF

      # ---------------------------------------------
      # Limpieza
      # ---------------------------------------------
      - name: Detener contenedores
        if: always()
        run: |
          docker rm -f carrito-app carrito-mongodb || true
          docker network rm carrito-net || true