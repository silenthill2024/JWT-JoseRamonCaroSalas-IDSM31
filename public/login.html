<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GameStore | Iniciar sesión</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body class="login-body">

    <div class="login-container">

        <div class="login-card">

            <div class="login-logo">
                🎮
            </div>

            <h1>GameStore</h1>

            <p class="login-subtitle">
                Inicia sesión para acceder a tu tienda
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="ejemplo@correo.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresa tu contraseña"
                        required
                    >

                </div>


                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        Recordarme

                    </label>

                    <a href="#">
                        ¿Olvidaste tu contraseña?
                    </a>

                </div>


                <button
                    type="submit"
                    class="btn-primary login-button">

                    Iniciar sesión

                </button>

            </form>


            <div id="mensaje"
                 class="mensaje">
            </div>


            <div class="separator">

                <span>o</span>

            </div>


            <button
                type="button"
                class="btn-google"
                onclick="loginGoogle()">

                <span>G</span>

                Continuar con Google

            </button>


            <p class="register-text">

                ¿No tienes una cuenta?

                <a href="/public/register.html">
                    Crear cuenta
                </a>

            </p>

        </div>


        <div class="login-footer">

            <p>
                © 2026 GameStore · Todos los derechos reservados
            </p>

        </div>

    </div>


    <script src="/js/login.js"></script>

</body>

</html>
